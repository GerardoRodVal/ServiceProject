<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de tu vehículo</title>
<meta name="description" content="Avance del servicio de tu vehículo en el taller, en tiempo real.">
<meta name="theme-color" content="#04438F">
<link rel="manifest" href="taller.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Vista del cliente: solo lectura. Se abre al escanear el QR pegado en el auto. */
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --ink: #17202A; --muted: #5C6773; --line: #DCE2DD;
  --accent: #04438F; --accent-ink: #FFFFFF; --soft: #E3EAF8;
  --mid: #A35F00; --mid-bg: #FBF0DC; --bad: #B42318;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0E13; --surface: #151D27; --ink: #E8EEF4; --muted: #8792A2; --line: rgba(255,255,255,.09);
    --accent: #8FA3E0; --accent-ink: #0B1530; --soft: #1A2440;
    --mid: #F2B54A; --mid-bg: rgba(242,181,74,.14); --bad: #F08A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0E13; --surface: #151D27; --ink: #E8EEF4; --muted: #8792A2; --line: rgba(255,255,255,.09);
  --accent: #8FA3E0; --accent-ink: #0B1530; --soft: #1A2440;
  --mid: #F2B54A; --mid-bg: rgba(242,181,74,.14); --bad: #F08A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(28px, env(safe-area-inset-bottom, 0px));
}
h1, h2, p, ul { margin: 0; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
h2 { font-size: 16px; font-weight: 700; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
[hidden] { display: none !important; }
ul { list-style: none; padding: 0; }
main { max-width: 560px; margin: 0 auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; }
.cab { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.placa { display: inline-block; margin-top: 8px; font-size: 14px; font-weight: 800; letter-spacing: .06em; padding: 4px 10px; border-radius: 8px; border: 2px solid var(--ink); }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 5px 11px; border-radius: 999px; background: var(--soft); color: var(--accent); white-space: nowrap; }
.tag.warn { background: var(--mid-bg); color: var(--mid); }
.tag.ok { background: var(--accent); color: var(--accent-ink); }

.avance { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
.anillo { --p: 0; width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); transition: background .6s ease; }
.anillo span { width: 68px; height: 68px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.avance p + p { margin-top: 4px; }

.vivo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.vivo::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulso 1.8s ease-in-out infinite; }
.vivo.sin::before { background: var(--bad); animation: none; }
@keyframes pulso { 50% { opacity: .3; } }

.tareas li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.tareas li:first-child { border-top: 0; padding-top: 0; }
.ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; border: 2px solid var(--line); color: var(--muted); }
.ico.hecho { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ico.en_proceso { border-color: var(--mid); color: var(--mid); background: var(--mid-bg); }
.tarea-nombre { font-weight: 700; }
.tarea-nombre.hecho { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tarea-nota { font-size: 13px; color: var(--muted); margin-top: 2px; }
.estado-txt { font-size: 12px; color: var(--muted); margin-top: 2px; }

.fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.foto { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700; color: #fff; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 999px; }

.bitacora li { padding: 10px 0; border-top: 1px solid var(--line); }
.bitacora li:first-child { border-top: 0; padding-top: 0; }
.bitacora small { color: var(--muted); font-size: 12px; }

.aviso { text-align: center; padding: 40px 18px; }
.aviso h2 { margin-bottom: 8px; }
.aviso p { color: var(--muted); }
</style>
</head>
<body>

<main>
  <section id="aviso" class="card aviso" hidden>
    <h2 id="avisoTitulo">Enlace no válido</h2>
    <p id="avisoTexto"></p>
  </section>

  <div id="contenido" hidden>
    <header class="card">
      <div class="cab">
        <div>
          <p class="eyebrow" id="taller">Taller</p>
          <h1 id="vehiculo">Tu vehículo</h1>
          <span class="placa" id="placa" hidden></span>
        </div>
        <div style="text-align:right">
          <span class="tag" id="estado">—</span>
          <p class="vivo" id="vivo" style="margin-top:10px">En vivo</p>
        </div>
      </div>
      <div class="avance">
        <div class="anillo" id="anillo"><span id="porcentaje">0%</span></div>
        <div>
          <h2 id="resumen">Sin servicios</h2>
          <p class="muted small" id="promesa" hidden></p>
          <p class="muted small" id="actualizado"></p>
        </div>
      </div>
    </header>

    <section class="card">
      <h2>Servicios</h2>
      <ul class="tareas" id="tareas" style="margin-top:12px"></ul>
    </section>

    <section class="card" id="seccionFotos" hidden>
      <h2>Fotos</h2>
      <div class="fotos" id="fotos" style="margin-top:12px"></div>
    </section>

    <section class="card" id="seccionBitacora" hidden>
      <h2>Historial</h2>
      <ul class="bitacora" id="bitacora" style="margin-top:12px"></ul>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ESTADO = { recibido: 'Recibido', en_proceso: 'En proceso', listo: 'Listo para entregar', entregado: 'Entregado' };
const ETAPA = { recepcion: 'Recepción', avance: 'Avance', entrega: 'Entrega' };
const TAREA = { pendiente: 'Pendiente', en_proceso: 'En proceso', hecho: 'Terminado' };
const ICONO = { pendiente: '', en_proceso: '◐', hecho: '✓' };
const token = new URLSearchParams(location.search).get('v');
const base = `/api/taller/seguimiento/${encodeURIComponent(token || '')}`;

let firma = '';          // para no redibujar si nada cambió (evita parpadeos cada 5 s)
let ultimaVez = null;

function fechaHora(iso) {
  return new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function mostrarAviso(titulo, texto) {
  $('#contenido').hidden = true;
  $('#aviso').hidden = false;
  $('#avisoTitulo').textContent = titulo;
  $('#avisoTexto').textContent = texto;
}

function pintar(d) {
  const p = d.progreso;
  const v = d.vehiculo;
  $('#taller').textContent = d.taller || 'Taller';
  $('#vehiculo').textContent = [v.marca, v.modelo, v.anio].filter(Boolean).join(' ');
  $('#placa').textContent = v.placa || 'Sin placa';
  $('#placa').hidden = !v.placa;
  $('#estado').textContent = ESTADO[d.estado] || d.estado;
  $('#estado').className = `tag ${d.estado === 'listo' || d.estado === 'entregado' ? 'ok' : d.estado === 'en_proceso' ? 'warn' : ''}`;
  $('#anillo').style.setProperty('--p', p.porcentaje);
  $('#porcentaje').textContent = `${p.porcentaje}%`;
  $('#resumen').textContent = p.total ? `${p.hechas} de ${p.total} servicios terminados` : 'Sin servicios';
  $('#promesa').hidden = !d.promesa;
  if (d.promesa) {
    $('#promesa').textContent = `Entrega prometida: ${new Date(d.promesa + 'T12:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long' })}`;
  }

  $('#tareas').innerHTML = d.tareas.length ? d.tareas.map(t => `
    <li>
      <span class="ico ${t.estado}" aria-label="${TAREA[t.estado]}">${ICONO[t.estado]}</span>
      <div>
        <div class="tarea-nombre ${t.estado}">${esc(t.nombre)}</div>
        <div class="estado-txt">${TAREA[t.estado]}${t.actualizado ? ' · ' + esc(fechaHora(t.actualizado)) : ''}</div>
        ${t.nota ? `<div class="tarea-nota">${esc(t.nota)}</div>` : ''}
      </div>
    </li>`).join('') : '<li><span class="muted">Aún no hay servicios registrados.</span></li>';

  $('#seccionFotos').hidden = !d.fotos.length;
  $('#fotos').innerHTML = d.fotos.map((f, i) => `
    <a class="foto" href="${base}/foto/${encodeURIComponent(f.id)}" target="_blank" rel="noopener">
      <img loading="lazy" alt="Foto ${i + 1}" src="${base}/foto/${encodeURIComponent(f.id)}">
      <span>${esc(ETAPA[f.etapa] || f.etapa)}</span>
    </a>`).join('');

  $('#seccionBitacora').hidden = !d.eventos.length;
  $('#bitacora').innerHTML = [...d.eventos].reverse().map(e => `
    <li>${esc(e.texto)}<br><small>${esc(fechaHora(e.cuando))}${e.quien ? ' · ' + esc(e.quien) : ''}</small></li>`).join('');
}

function marcarVivo(ok) {
  $('#vivo').classList.toggle('sin', !ok);
  $('#vivo').textContent = ok
    ? (ultimaVez ? `Actualizado ${ultimaVez.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}` : 'En vivo')
    : 'Sin conexión, reintentando…';
}

async function refrescar() {
  if (!token) return mostrarAviso('Escanea el QR del vehículo', 'Este enlace se abre desde el código pegado en el auto.');
  let r;
  try {
    r = await fetch(base, { cache: 'no-store' });
  } catch {
    return marcarVivo(false);
  }
  if (r.status === 404) return mostrarAviso('Enlace no válido', 'No encontramos este vehículo. Pide al taller un código nuevo.');
  if (!r.ok) return marcarVivo(false);
  const d = await r.json();
  $('#aviso').hidden = true;
  $('#contenido').hidden = false;
  ultimaVez = new Date();
  marcarVivo(true);
  const nueva = JSON.stringify(d);
  if (nueva !== firma) {
    firma = nueva;
    pintar(d);
  }
}

// Actualización casi en tiempo real: cada 5 s mientras la página está a la vista.
setInterval(() => { if (!document.hidden) refrescar(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refrescar(); });
refrescar();
</script>
</body>
</html>
