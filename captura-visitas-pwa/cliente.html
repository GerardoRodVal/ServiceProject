<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Vista del cliente</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg:#F4F6F3; --surface:#FFFFFF; --ink:#17202A; --muted:#5C6773; --line:#DCE2DD; --accent:#04438F; --soft:#E3EAF8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0A0E13; --surface:#151D27; --ink:#E8EEF4; --muted:#8792A2; --line:rgba(255,255,255,.09); --accent:#8FA3E0; --soft:#1A2440; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Manrope, system-ui, sans-serif; }
  .cliente { max-width: 560px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; gap:14px; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .muted { color: var(--muted); }
  .tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .foto { width: 100%; height: 240px; object-fit: cover; display:block; background: var(--line); }
  .sin-foto { height: 240px; display:flex; align-items:center; justify-content:center; color: var(--muted); background: var(--line); font-size: 14px; }
  .ficha { padding: 16px 18px 18px; display:flex; flex-direction:column; gap:8px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.2; }
  .precio { font-size: 26px; font-weight: 800; color: var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .chip { font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); }
  p.desc { margin: 6px 0 0; line-height: 1.55; font-size: 15px; white-space: pre-line; }
  .pie { font-size: 13px; color: var(--muted); text-align: center; padding: 6px 8px 18px; }
  .barra-cliente { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .barra-cliente button { font: inherit; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .barra-cliente #cerrar { background: var(--accent); color: #FFFFFF; border-color: transparent; }
  .barra-cliente .aviso { font-size: 13px; color: var(--muted); align-self: center; }
</style>
</head>
<body>
<nav class="barra-cliente" aria-label="Navegación">
  <button type="button" id="regresar">← Regresar</button>
  <span class="aviso" id="avisoCerrar" hidden>Puedes cerrar esta pestaña.</span>
  <button type="button" id="cerrar">Cerrar</button>
</nav>
<main class="cliente" id="main"><p class="muted">Cargando la casa…</p></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
const ENTREGA = { inmediata: 'Entrega inmediata', preventa: 'Preventa' };
// El gestor guarda «apartado» y «vendido» (en masculino); antes aquí solo estaban en femenino y esos estatus no se mostraban.
const ESTATUS = { disponible: 'Disponible', apartado: 'Apartada', apartada: 'Apartada', vendido: 'Vendida', vendida: 'Vendida' };

// Regresar: a la pantalla anterior si la hay. Cerrar: cierra la pestaña (si el navegador lo permite).
document.getElementById('regresar').addEventListener('click', () => {
  if (history.length > 1) history.back();
  else document.getElementById('cerrar').click();
});
document.getElementById('cerrar').addEventListener('click', () => {
  window.close();
  setTimeout(() => { document.getElementById('avisoCerrar').hidden = false; }, 300);
});

(async () => {
  const main = document.getElementById('main');
  const params = new URLSearchParams(location.search);
  const id = params.get('p') || '';
  const token = params.get('n') || '';      // con «n» (token del negocio) la casa viene de la nube; sin él, del gestor
  let p, zona, negocioNombre;
  if (token) {
    // En la nube la API entrega solo la ficha de esta casa (no la configuración del negocio).
    let res;
    try {
      res = await fetch(`api/publico/${encodeURIComponent(token)}/casa/${encodeURIComponent(id)}`, { cache: 'no-store' });
    } catch {
      main.innerHTML = '<p class="muted">No se pudo abrir la casa. Revisa tu conexión.</p>';
      return;
    }
    if (res.status === 404) {
      main.innerHTML = '<p class="muted">Pide a tu asesor el enlace de la casa.</p>';
      return;
    }
    if (!res.ok) {
      main.innerHTML = '<p class="muted">No se pudo abrir la casa. Intenta de nuevo en un momento.</p>';
      return;
    }
    const d = await res.json();
    p = d.casa;
    zona = d.zona;
    negocioNombre = d.negocio && d.negocio.nombre;
  } else {
    let cfg;
    try {
      const res = await fetch('config.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      cfg = await res.json();
    } catch {
      main.innerHTML = '<p class="muted">No se pudo abrir la casa. Revisa que estés en la red de la oficina.</p>';
      return;
    }
    p = (cfg.propiedades || []).find(x => x.id === id);
    if (!p) {
      main.innerHTML = '<p class="muted">Pide a tu asesor el enlace de la casa.</p>';
      return;
    }
    zona = (cfg.zonas || []).find(z => z.id === p.zona);
    negocioNombre = cfg.negocio && cfg.negocio.nombre;
  }
  document.title = p.nombre;
  const foto = p.imagen
    ? `<img class="foto" src="api/imagen/${esc(p.imagen)}" alt="Foto de ${esc(p.nombre)}">`
    : '<div class="sin-foto">Sin foto</div>';
  const chips = [
    `${p.recamaras} recámaras`, `${p.banos} baños`, `${p.estacionamientos} cajones`,
    `${p.m2_construccion} m² construcción`, `${p.m2_terreno} m² terreno`,
    ENTREGA[p.entrega], ESTATUS[p.estatus]
  ].filter(Boolean);
  main.innerHTML = `
    <p class="eyebrow">${esc(negocioNombre || '')}</p>
    <section class="tarjeta">
      ${foto}
      <div class="ficha">
        <p class="eyebrow">${esc(zona ? zona.nombre : '')}</p>
        <h1>${esc(p.nombre)}</h1>
        ${p.direccion ? `<div class="muted">${esc(p.direccion)}</div>` : ''}
        <div class="precio">${fmt.format(p.precio)}</div>
        <div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
        ${p.descripcion ? `<p class="desc">${esc(p.descripcion)}</p>` : ''}
      </div>
    </section>
    <p class="pie">Información de la casa. Pregunta a tu asesor por disponibilidad y opciones de crédito.</p>`;
})();
</script>
</body>
</html>
