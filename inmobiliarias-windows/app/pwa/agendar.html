<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Agenda tu visita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg:#F4F6F3; --surface:#FFFFFF; --ink:#17202A; --muted:#5C6773; --line:#DCE2DD; --accent:#04438F; --soft:#E3EAF8; --bad:#C2413A; --ok:#0A7D5C; --sobre:#FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0A0E13; --surface:#151D27; --ink:#E8EEF4; --muted:#8792A2; --line:rgba(255,255,255,.12); --accent:#8FA3E0; --soft:#1A2440; --bad:#F08A80; --ok:#3CC4A7; --sobre:#0A0E13; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: Manrope, system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; display:flex; flex-direction:column; gap:16px; }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
  h1 { margin: 4px 0 8px; font-size: 26px; line-height: 1.2; }
  .muted { color: var(--muted); }
  .mensaje { margin: 0; line-height: 1.55; font-size: 15px; white-space: pre-line; }
  .tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display:flex; flex-direction:column; gap:14px; }
  label, .campo { display:flex; flex-direction:column; gap:6px; font-size: 14px; font-weight: 700; }
  input, select, textarea {
    font: inherit; font-weight: 500; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .campo > span { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .campo > span small { font-weight: 500; color: var(--muted); font-size: 12px; }
  /* Días: una tira que se desliza; horas: cuadrícula. Solo aparecen los espacios libres. */
  .dias { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scroll-snap-type: x proximity; scrollbar-width: none; }
  .dias::-webkit-scrollbar { display: none; }
  .opcion { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg); cursor: pointer; font-weight: 700; }
  .opcion input { position: absolute; opacity: 0; pointer-events: none; width: auto; }
  .opcion:has(input:checked) { border-color: var(--accent); background: var(--soft); color: var(--accent); }
  .opcion:has(input:focus-visible) { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .dias .opcion { flex: none; width: 66px; padding: 9px 4px; scroll-snap-align: start; }
  .dias .opcion small { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .dias .opcion b { font-size: 20px; line-height: 1.1; }
  .dias .opcion:has(input:checked) small { color: var(--accent); }
  .horas { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .horas .opcion { padding: 11px 6px; font-size: 15px; }
  .pista { margin: 0; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--muted); text-align: center; }
  .trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button.enviar { font: inherit; font-weight: 800; font-size: 16px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--sobre); cursor: pointer; }
  button.enviar:disabled { opacity: .6; cursor: progress; }
  .error { margin: 0; color: var(--bad); font-weight: 700; font-size: 14px; }
  .aviso { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .listo { text-align: center; padding: 30px 18px; }
  .listo .ico { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display:grid; place-items:center; background: var(--soft); color: var(--ok); }
  .listo .ico svg { width: 34px; height: 34px; }
  .pie { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main id="main"><p class="muted">Cargando…</p></main>
<script>
// Agenda en línea. Con «n» (token del negocio) la página y la solicitud van a la nube; sin él, al gestor de la red local.
// «a» identifica al asesor que repartió el enlace o el QR: la solicitud le llega a él.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
const token = params.get('n') || '';
const asesor = /^[a-z0-9-]{1,60}$/.test(params.get('a') || '') ? params.get('a') : '';
const DEFECTO = {
  activa: true, titulo: 'Agenda tu visita',
  mensaje: 'Déjanos tus datos, la propiedad que te interesa y el horario que prefieres. Un asesor te llamará o te escribirá por WhatsApp para confirmar tu visita.'
};
const main = document.getElementById('main');
// Días y horas libres: los calcula el servidor con el horario de atención del negocio. La página nunca recibe las
// citas de otros clientes, solo qué espacios siguen libres.
let disponibles = [];

// Sin nube: se arma con el config.json del gestor (mismo criterio que la nube: no se ofrecen las vendidas).
function paginaLocal(cfg) {
  const f = { ...DEFECTO, ...(cfg.cita_publica || {}) };
  if (f.activa === false) return null;
  const zonas = (cfg.zonas || []).filter(z => z && typeof z.id === 'string');
  const casas = (cfg.propiedades || []).filter(p => p && typeof p.id === 'string' && p.estatus !== 'vendido');
  const ids = new Set(zonas.map(z => z.id));
  const casa = p => ({ id: p.id, nombre: p.nombre || '' });
  return {
    negocio: { nombre: (cfg.negocio || {}).nombre || '', tipo: (cfg.negocio || {}).tipo === 'desarrollo' ? 'desarrollo' : 'intermediacion' },
    titulo: f.titulo || DEFECTO.titulo, mensaje: f.mensaje || DEFECTO.mensaje,
    zonas: zonas.map(z => ({ id: z.id, nombre: z.nombre || '', casas: casas.filter(p => p.zona === z.id).map(casa) })),
    sueltas: casas.filter(p => !ids.has(p.zona)).map(casa)
  };
}

function noDisponible(texto) {
  main.innerHTML = `<div class="tarjeta listo"><h1>Agenda no disponible</h1><p class="muted">${esc(texto || 'Esta agenda no está disponible por ahora. Contacta directamente a tu asesor.')}</p></div>`;
}

const DIA_CORTO = new Intl.DateTimeFormat('es-MX', { weekday: 'short' });
const MES_CORTO = new Intl.DateTimeFormat('es-MX', { month: 'short' });
const DIA_LARGO = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
const fechaDe = iso => new Date(`${iso}T12:00:00`);
const limpiarPunto = t => t.replace('.', '');
function horaLegible(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'a.m.' : 'p.m.'}`;
}

// La propiedad: las casas no vendidas, agrupadas por zona o desarrollo. Si el negocio no tiene casas, sus zonas.
function opcionesPropiedad(d) {
  const casas = d.zonas.some(z => z.casas.length) || d.sueltas.length;
  if (!casas) return d.zonas.map(z => `<option value="z:${esc(z.id)}">${esc(z.nombre)}</option>`).join('');
  return d.zonas.filter(z => z.casas.length).map(z => `<optgroup label="${esc(z.nombre)}">
      ${z.casas.map(c => `<option value="c:${esc(c.id)}">${esc(c.nombre)}</option>`).join('')}</optgroup>`).join('')
    + (d.sueltas.length ? `<optgroup label="Otras propiedades">${d.sueltas.map(c => `<option value="c:${esc(c.id)}">${esc(c.nombre)}</option>`).join('')}</optgroup>` : '');
}

function pintarDias(elegido) {
  const caja = document.getElementById('dias');
  if (!disponibles.length) {
    caja.outerHTML = '<p class="pista" id="dias">Por ahora no hay horarios libres. Escríbele a tu asesor para buscar otro momento.</p>';
    document.getElementById('enviar').disabled = true;
    pintarHoras('');
    return;
  }
  caja.innerHTML = disponibles.map(x => {
    const f = fechaDe(x.fecha);
    return `<label class="opcion" title="${esc(DIA_LARGO.format(f))}"><input type="radio" name="fecha" value="${esc(x.fecha)}" ${x.fecha === elegido ? 'checked' : ''}>
      <small>${esc(limpiarPunto(DIA_CORTO.format(f)))}</small><b>${f.getDate()}</b><small>${esc(limpiarPunto(MES_CORTO.format(f)))}</small></label>`;
  }).join('');
  pintarHoras(disponibles.some(x => x.fecha === elegido) ? elegido : '');
}

function pintarHoras(fecha, horaElegida) {
  const caja = document.getElementById('horas');
  const dia = disponibles.find(x => x.fecha === fecha);
  document.getElementById('diaElegido').textContent = dia ? DIA_LARGO.format(fechaDe(fecha)) : '';
  caja.innerHTML = dia
    ? `<div class="horas" role="radiogroup" aria-label="Hora">${dia.horas.map(h => `<label class="opcion"><input type="radio" name="horario" value="${esc(h)}" ${h === horaElegida ? 'checked' : ''}>${esc(horaLegible(h))}</label>`).join('')}</div>`
    : '<p class="pista">Elige primero el día para ver las horas libres.</p>';
}

// Cómo quiere el cliente que lo contacten; según la elección se pide el dato correspondiente.
const METODOS = [['telefono', 'Teléfono'], ['whatsapp', 'WhatsApp'], ['correo', 'Correo electrónico'], ['redes', 'Instagram o Facebook']];
const CAMPO_CONTACTO = {
  telefono: { etiqueta: 'Tu teléfono', tipo: 'tel', modo: 'tel', auto: 'tel', largo: 20, ejemplo: '10 dígitos' },
  whatsapp: { etiqueta: 'Tu número de WhatsApp', tipo: 'tel', modo: 'tel', auto: 'tel', largo: 20, ejemplo: '10 dígitos' },
  correo: { etiqueta: 'Tu correo electrónico', tipo: 'email', modo: 'email', auto: 'email', largo: 120, ejemplo: 'tu@correo.com' },
  redes: { etiqueta: 'Tu usuario de Instagram o Facebook', tipo: 'text', modo: 'text', auto: 'off', largo: 41, ejemplo: '@tuusuario' }
};
function pintarContacto(metodo) {
  const c = CAMPO_CONTACTO[metodo];
  document.getElementById('campoContacto').innerHTML = c
    ? `<label>${c.etiqueta}<input name="contacto" type="${c.tipo}" inputmode="${c.modo}" autocomplete="${c.auto}" maxlength="${c.largo}" placeholder="${c.ejemplo}" required></label>`
    : '';
}

function formulario(d) {
  document.title = d.titulo;
  disponibles = Array.isArray(d.disponibles) ? d.disponibles : [];
  const hayOpciones = d.zonas.length || d.sueltas.length;
  main.innerHTML = `
    <header>
      ${d.negocio.nombre ? `<p class="eyebrow">${esc(d.negocio.nombre)}</p>` : ''}
      <h1>${esc(d.titulo)}</h1>
      <p class="mensaje muted">${esc(d.mensaje)}</p>
    </header>
    <form class="tarjeta" id="form" novalidate>
      <label>Tu nombre<input name="nombre" autocomplete="name" maxlength="80" required></label>
      <label>Método de contacto<select name="metodo" required><option value="">Elige cómo te contactamos</option>${METODOS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></label>
      <div id="campoContacto"></div>
      ${hayOpciones ? `<label>¿Qué propiedad te interesa?
        <select name="interes" required><option value="">Elige una propiedad</option>${opcionesPropiedad(d)}</select></label>` : ''}
      <div class="campo"><span>¿Qué día?</span>
        <div class="dias" id="dias" role="radiogroup" aria-label="Día"></div></div>
      <div class="campo"><span>¿A qué hora? <small id="diaElegido"></small></span>
        <div id="horas"></div></div>
      <div class="trampa" aria-hidden="true"><label>Sitio web<input name="sitio" tabindex="-1" autocomplete="off"></label></div>
      <p class="error" id="error" role="alert" hidden></p>
      <button class="enviar" type="submit" id="enviar">Solicitar mi cita</button>
      <p class="aviso">Usaremos tus datos solo para contactarte, por el medio que elegiste, sobre esta visita.</p>
    </form>`;
  const form = document.getElementById('form');
  form.addEventListener('submit', e => enviar(e, d));
  form.addEventListener('change', e => {
    if (e.target.name === 'fecha') pintarHoras(e.target.value);
    if (e.target.name === 'metodo') pintarContacto(e.target.value);
  });
  pintarDias('');
}

// Vuelve a pedir los espacios libres (si alguien ganó el horario mientras el cliente llenaba la página).
async function leerDisponibles() {
  const r = await fetch(token ? `api/publico/${encodeURIComponent(token)}/cita` : 'api/cita/disponibles', { cache: 'no-store' });
  if (!r.ok) throw new Error('No pudimos cargar los horarios.');
  return (await r.json()).disponibles || [];
}

async function enviar(e, d) {
  e.preventDefault();
  const f = e.target;
  const error = document.getElementById('error');
  const boton = document.getElementById('enviar');
  const interes = f.interes ? f.interes.value : '';
  const metodo = f.metodo.value;
  const contacto = f.contacto ? f.contacto.value.trim() : '';
  const cuerpo = {
    nombre: f.nombre.value.trim(), metodo, contacto,
    zona: interes.startsWith('z:') ? interes.slice(2) : '', casa: interes.startsWith('c:') ? interes.slice(2) : '',
    fecha: (f.querySelector('[name="fecha"]:checked') || {}).value || '',
    horario: (f.querySelector('[name="horario"]:checked') || {}).value || '', asesor, sitio: f.sitio.value
  };
  const problema = cuerpo.nombre.length < 2 ? 'Escribe tu nombre.'
    : !metodo ? 'Elige cómo quieres que te contactemos.'
    : !contacto ? 'Escribe tu dato de contacto.'
    : (f.interes && !interes) ? 'Elige la propiedad que te interesa.'
    : !cuerpo.fecha ? 'Elige el día de tu visita.'
    : !cuerpo.horario ? 'Elige la hora de tu visita.' : '';
  if (problema) { error.textContent = problema; error.hidden = false; return; }
  error.hidden = true;
  boton.disabled = true;
  boton.textContent = 'Enviando…';
  try {
    const r = await fetch(token ? `api/publico/${encodeURIComponent(token)}/cita` : 'api/cita/solicitud', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Captura': '1' }, body: JSON.stringify(cuerpo)
    });
    const datos = await r.json().catch(() => ({}));
    if (r.status === 409) {           // el horario se ocupó: se muestran otra vez solo los libres, sin perder lo escrito
      disponibles = await leerDisponibles().catch(() => disponibles.filter(x => x.fecha !== cuerpo.fecha || x.horas.some(h => h !== cuerpo.horario)));
      pintarDias(cuerpo.fecha);
      throw new Error(datos.error || datos.detail || 'Ese horario ya no está disponible. Elige otro, por favor.');
    }
    if (!r.ok) throw new Error(datos.error || datos.detail || 'No pudimos enviar tu solicitud. Intenta de nuevo.');
    main.innerHTML = `<div class="tarjeta listo">
      <div class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>¡Listo, ${esc(cuerpo.nombre.split(' ')[0])}!</h1>
      <p class="mensaje muted">Recibimos tu solicitud para el <b>${esc(DIA_LARGO.format(fechaDe(cuerpo.fecha)))}</b> a las <b>${esc(horaLegible(cuerpo.horario))}</b>${horaLegible(cuerpo.horario).endsWith('.') ? '' : '.'} Un asesor te llamará o te escribirá por WhatsApp para confirmarla.</p>
    </div>${d.negocio.nombre ? `<p class="pie">${esc(d.negocio.nombre)}</p>` : ''}`;
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
    boton.disabled = false;
    boton.textContent = 'Solicitar mi cita';
  }
}

(async () => {
  try {
    if (token) {
      const r = await fetch(`api/publico/${encodeURIComponent(token)}/cita`, { cache: 'no-store' });
      if (!r.ok) return noDisponible();
      return formulario(await r.json());
    }
    const r = await fetch('config.json', { cache: 'no-store' });
    const pagina = r.ok ? paginaLocal(await r.json()) : null;
    if (!pagina) return noDisponible();
    pagina.disponibles = await leerDisponibles();
    return formulario(pagina);
  } catch {
    noDisponible('No pudimos cargar la agenda. Revisa tu conexión e intenta de nuevo.');
  }
})();
</script>
</body>
</html>
